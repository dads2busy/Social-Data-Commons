name: geographic_mobility_hoi
version: "1.0.1"
title: "Geographic Mobility (HOI)"
description: "Geographic mobility rates from ACS table B07204 (Geographical Mobility in the Past Year by Educational Attainment), measuring the percentage of the population that moved in the past year. Block group estimates are produced via areal interpolation from tract-level data. This dataset is produced by the Social Data Commons at the University of Virginia as part of the Health Opportunity Index (HOI)."

sources:
  ncr:
    type: census_acs
    profile: NCR
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      total_pop: "B07204_001"
      pop_moving: "B07204_003"

  va:
    type: census_acs
    profile: VA
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      total_pop: "B07204_001"
      pop_moving: "B07204_003"

output:
  path: data/distribution
  standardize: true

prepare:
  crosswalk: ../../geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv
  source_col: ct_geoid
  target_col: hd_geoid
  method: mean

  redistribution:
    source_level: tract
    methods: [direct]
    count_measures: [geo_mobility_total_count, geo_mobility_moving_count]
    pct_specs:
      perc_moving: [geo_mobility_moving_count, geo_mobility_total_count]
    source_geos:
      geo20: geographies/VA/Census Geographies/Tract/2020/data/distribution/va_geo_census_cb_2020_census_tracts.geojson
      geo10: geographies/VA/Census Geographies/Tract/2010/data/distribution/va_geo_census_cb_2010_census_tracts.geojson
    target_geos:
      block_group:
        geo20: geographies/VA/Census Geographies/Block Group/2020/data/distribution/va_geo_census_cb_2020_census_block_groups.geojson
        geo10: geographies/VA/Census Geographies/Block Group/2010/data/distribution/va_geo_census_cb_2010_census_block_groups.geojson

prepare_ncr:
  redistribution:
    source_level: tract
    methods: [direct]
    count_measures: [geo_mobility_total_count, geo_mobility_moving_count]
    pct_specs:
      perc_moving: [geo_mobility_moving_count, geo_mobility_total_count]
    source_geos:
      geo20: geographies/NCR/Census Geographies/Tract/2020/data/distribution/ncr_geo_census_cb_2020_census_tracts.geojson
      geo10: geographies/NCR/Census Geographies/Tract/2010/data/distribution/ncr_geo_census_cb_2010_census_tracts.geojson
    target_geos:
      block_group:
        geo20: geographies/NCR/Census Geographies/Block Group/2020/data/distribution/ncr_geo_census_cb_2020_census_block_groups.geojson
        geo10: geographies/NCR/Census Geographies/Block Group/2010/data/distribution/ncr_geo_census_cb_2010_census_block_groups.geojson
