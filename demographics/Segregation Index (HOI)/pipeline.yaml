name: segregation
version: "1.0.1"
zenodo_deposit_id: 18914969
title: "Segregation Index (HOI)"
description: >-
  Residential segregation indicator computed as the Entropy Index (Theil's H)
  from ACS table B03002 (Hispanic or Latino Origin by Race) race/ethnicity data,
  measuring how sub-area racial/ethnic composition differs from the overall state
  composition. The index uses eight race/ethnicity categories: Hispanic/Latino,
  White, Black, American Indian, Asian, Native Hawaiian/Pacific Islander, Some
  Other Race, and Two or More Races. Builds on methodology used in the Virginia
  Department of Health's Health Opportunity Index (HOI).
temporal_label: "ACS 5-year estimates"

sources:
  ncr:
    type: census_acs
    profile: NCR
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [block_group, tract, county]
    variables:
      total_pop: "B03002_001"
      hisp_latin: "B03002_012"
      white: "B03002_003"
      black: "B03002_004"
      american_indian: "B03002_005"
      asian: "B03002_006"
      nhopi: "B03002_007"
      sor: "B03002_008"
      two: "B03002_009"

  va:
    type: census_acs
    profile: VA
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract]
    variables:
      total_pop: "B03002_001"
      hisp_latin: "B03002_012"
      white: "B03002_003"
      black: "B03002_004"
      american_indian: "B03002_005"
      asian: "B03002_006"
      nhopi: "B03002_007"
      sor: "B03002_008"
      two: "B03002_009"

crosswalks:
  county_to_health_district: geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv

output:
  path: data/distribution
  standardize: true

prepare:
  crosswalk: ../../geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv
  source_col: ct_geoid
  target_col: hd_geoid
  method: sum
