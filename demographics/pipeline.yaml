name: population_demographics
version: "1.0.0"
zenodo_deposit_id: 19205882
title: "Population Demographics: Age, Gender, and Race"
description: "Population age, gender, and race/ethnicity distributions from ACS tables B01001 (Sex by Age), B02001 (Race), and B03003 (Hispanic or Latino Origin), providing counts and percentages at block group, tract, and county levels. All measures are standardized to 2020 Census geographies using area-weighted crosswalks, enabling consistent multi-year analysis from 2009 to 2024."
temporal_label: "ACS 5-year estimates"

output:
  path: data/distribution

topics:
  - name: gender
    type: acs_ingest
    script: gender/code/ingest.py

  - name: race
    type: acs_ingest
    script: race/code/ingest.py

  - name: language
    type: acs_ingest
    script: language/code/ingest.py

  - name: veteran
    type: acs_ingest
    script: veteran/code/ingest.py

  - name: age
    type: acs_ingest
    script: age/code/ingest.py

  - name: geographic_mobility_hoi
    type: acs_ingest_prepare
    ingest: Geographic Mobility (HOI)/code/ingest.py
    prepare: Geographic Mobility (HOI)/code/prepare.py

  - name: population_density
    type: acs_ingest_prepare
    ingest: population_density/code/ingest.py
    prepare: population_density/code/prepare.py

  - name: segregation
    type: acs_ingest_prepare
    ingest: segregation/code/ingest.py
    prepare: segregation/code/prepare.py

  - name: cooperative_extension
    type: custom
    script: cooperative_extension/code/prepare.py
