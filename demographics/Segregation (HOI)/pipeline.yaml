name: segregation
version: "1.0.0"
description: "Residential segregation indicator computed as the Entropy Index (Theil's H) from ACS table DP05 race/ethnicity data, measuring how sub-area racial/ethnic composition differs from the overall state composition. The index uses eight race/ethnicity categories: Hispanic/Latino, White, Black, American Indian, Asian, Native Hawaiian/Pacific Islander, Some Other Race, and Two or More Races. This dataset is produced by the Social Data Commons at the University of Virginia as part of the Health Opportunity Index (HOI)."

sources:
  ncr:
    type: census_acs
    profile: NCR
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract]

    # Variable IDs changed between 2016 and 2017
    variables_2015_2016:
      total_pop: "DP05_0001"
      hisp_latin: "DP05_0066"
      white: "DP05_0072"
      black: "DP05_0073"
      american_indian: "DP05_0074"
      asian: "DP05_0075"
      nhopi: "DP05_0076"
      sor: "DP05_0077"
      two: "DP05_0078"

    variables_2017_plus:
      total_pop: "DP05_0001"
      hisp_latin: "DP05_0071"
      white: "DP05_0077"
      black: "DP05_0078"
      american_indian: "DP05_0079"
      asian: "DP05_0080"
      nhopi: "DP05_0081"
      sor: "DP05_0082"
      two: "DP05_0083"

  va:
    type: census_acs
    profile: VA
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract]

    # Variable IDs changed between 2016 and 2017
    variables_2015_2016:
      total_pop: "DP05_0001"
      hisp_latin: "DP05_0066"
      white: "DP05_0072"
      black: "DP05_0073"
      american_indian: "DP05_0074"
      asian: "DP05_0075"
      nhopi: "DP05_0076"
      sor: "DP05_0077"
      two: "DP05_0078"

    variables_2017_plus:
      total_pop: "DP05_0001"
      hisp_latin: "DP05_0071"
      white: "DP05_0077"
      black: "DP05_0078"
      american_indian: "DP05_0079"
      asian: "DP05_0080"
      nhopi: "DP05_0081"
      sor: "DP05_0082"
      two: "DP05_0083"

output:
  path: data/distribution
  standardize: true

prepare:
  crosswalk: ../../geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv
  source_col: ct_geoid
  target_col: hd_geoid
  method: sum
