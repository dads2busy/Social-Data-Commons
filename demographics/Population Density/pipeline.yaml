name: population_density
version: "1.0.0"
title: "Population Density"
description: "Population density (persons per square mile) combining ACS total population estimates (table B01001) with Census TIGER/Line geographic data for land area calculations. Density is computed as total population divided by land area in square miles at tract, county, and block group levels. This dataset is produced by the Social Data Commons at the University of Virginia."

sources:
  ncr:
    type: census_acs
    profile: NCR
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county, block_group]
    variables:
      total_pop: "B01001_001"

  va:
    type: census_acs
    profile: VA
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      total_pop: "B01001_001"

tiger:
  state_fips: "51"
  tract_layer: 8
  block_group_layer: 10
  county_layer: 86

output:
  path: data/distribution
  standardize: true

prepare:
  crosswalk: ../../geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv
  source_col: ct_geoid
  target_col: hd_geoid
  method: mean
