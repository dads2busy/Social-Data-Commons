name: gender_demographics
version: "1.0.0"
title: "Gender"
description: "Population gender distribution from ACS table B01001 (Sex by Age), providing counts and percentages for male and female populations."
temporal_label: "ACS 5-year estimates"

sources:
  ncr:
    type: census_acs
    profile: NCR
    years: [2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county, block_group]
    variables:
      total_pop: "B01001_001"
      male: "B01001_002"
      female: "B01001_026"

  va:
    type: census_acs
    profile: VA
    years: [2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      total_pop: "B01001_001"
      male: "B01001_002"
      female: "B01001_026"

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  standardize: true
