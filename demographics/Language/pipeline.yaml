name: language_demographics
version: "1.0.1"
title: "Language"
description: "Limited English speaking household estimates from ACS table C16002 (Household Language by Household Limited English Speaking Status), providing counts and percentages of households where no member 14 years and older speaks English 'very well.' Limited English households are summed across four language groups: Spanish, Indo-European, Asian/Pacific Islander, and other languages. This dataset is produced by the Social Data Commons at the University of Virginia."

sources:
  ncr:
    type: census_acs
    profile: NCR
    years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county, block_group]
    variables:
      total_hh: "C16002_001"
      spanish_limited: "C16002_004"
      indo_euro_limited: "C16002_007"
      asian_pacific_limited: "C16002_010"
      other_limited: "C16002_013"

  va:
    type: census_acs
    profile: VA
    years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      total_hh: "C16002_001"
      spanish_limited: "C16002_004"
      indo_euro_limited: "C16002_007"
      asian_pacific_limited: "C16002_010"
      other_limited: "C16002_013"

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  standardize: true
