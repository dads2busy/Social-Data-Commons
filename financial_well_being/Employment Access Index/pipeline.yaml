name: employment_access
version: "2.0.0"
title: "Employment Access Index"
zenodo_deposit_id: 18871546
description: >
  Employment Intensity (gravity model) from LEHD-LODES WAC job counts
  and TIGER/Line centroids. E = sum(jobs_i / dist_i^2) with hierarchical
  distance approximation and 200-mile radius cutoff.

sources:
  va:
    type: lodes_gravity
    profile: VA
    target_state_fips: "51"
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
    geographies: [tract, county]
    nearby_states:
      va: "51"
      md: "24"
      dc: "11"
      wv: "54"
      nc: "37"
      pa: "42"
      de: "10"
      nj: "34"
      ny: "36"
      oh: "39"
      ky: "21"
      tn: "47"
      sc: "45"
    lodes:
      version: LODES8
      fallback: LODES7
      segment: S000
      job_type: JT00
      job_column: C000
    gravity:
      max_distance_miles: 200
      block_threshold_miles: 34
      tract_threshold_miles: 165
      min_distance_miles: 1.0

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  standardize: true
