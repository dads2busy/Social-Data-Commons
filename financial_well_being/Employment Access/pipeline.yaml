name: employment_access
description: "Employment Access Index from H+T Affordability Index (Center for Neighborhood Technology)"

sources:
  va:
    type: mixed
    profile: VA
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021]
    geographies: [tract, county]
    original_files:
      tracts:
        2015: "data/original/htaindex2015_data_tracts_51.csv"
        2019: "data/original/htaindex2019_data_tracts_51.csv"
        2020: "data/original/htaindex2020_data_tracts_51.csv"
      counties:
        2015: "data/original/htaindex2015_data_counties_51.csv"
        2019: "data/original/htaindex2019_data_counties_51.csv"
        2020: "data/original/htaindex2020_data_counties_51.csv"
    measure_column: "emp_gravity"
    interpolated_years: [2016, 2017, 2018]
    extrapolated_years: [2021]

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  standardize: true
