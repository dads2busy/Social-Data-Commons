name: income_inequality
version: "1.0.0"
description: "Gini index of income inequality from ACS B19083"

sources:
  ncr:
    type: census_acs
    profile: NCR
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      gini_index: "B19083_001"

  va:
    type: census_acs
    profile: VA
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      gini_index: "B19083_001"

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  standardize: true
