name: material_deprivation
version: "1.0.0"
zenodo_deposit_id: 18914764
title: "Material Deprivation"
description: >-
  Townsend Material Deprivation Index for Virginia census tracts, counties,
  and health districts. Combines four ACS-derived indicators — unemployment
  rate, overcrowding, non-car ownership, and non-home ownership — into a
  z-score composite rescaled to 0–1, where higher values indicate greater
  material deprivation.
temporal_label: "ACS 5-year estimates"

sources:
  va:
    type: census_acs
    profile: VA
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      adult_pop: "B23025_002"
      unemployed: "B23025_005"
      occupancy_all: "B25014_001"
      occupant_1_plus_per_room_owner: "B25014_005"
      occupant_1_5_per_room_owner: "B25014_006"
      occupant_2_plus_per_room_owner: "B25014_007"
      occupant_1_plus_per_room_renter: "B25014_011"
      occupant_1_5_per_room_renter: "B25014_012"
      occupant_2_plus_per_room_renter: "B25014_013"
      households_total: "B25044_001"
      hh_owner_no_vehicle: "B25044_003"
      hh_renter_no_vehicle: "B25044_010"
      all_occupied_units: "S2502_C01_001"
      renter_occupied_units: "S2502_C05_001"

  ncr:
    type: census_acs
    profile: NCR
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      adult_pop: "B23025_002"
      unemployed: "B23025_005"
      occupancy_all: "B25014_001"
      occupant_1_plus_per_room_owner: "B25014_005"
      occupant_1_5_per_room_owner: "B25014_006"
      occupant_2_plus_per_room_owner: "B25014_007"
      occupant_1_plus_per_room_renter: "B25014_011"
      occupant_1_5_per_room_renter: "B25014_012"
      occupant_2_plus_per_room_renter: "B25014_013"
      households_total: "B25044_001"
      hh_owner_no_vehicle: "B25044_003"
      hh_renter_no_vehicle: "B25044_010"
      all_occupied_units: "S2502_C01_001"
      renter_occupied_units: "S2502_C05_001"

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  standardize: true
