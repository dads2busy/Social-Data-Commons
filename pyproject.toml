[project]
name = "sdc"
version = "0.1.0"
description = "Social Data Commons - Unified data pipeline monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.2",
    "openpyxl>=3.1.5",
    "osmnx>=2.0.0",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.14.0",
    "sdc-core",
    "sdc-census10to20",
    "sdc-redistribute",
    "sdc-catchment",
    "xlrd>=2.0.2",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sdc-core = { workspace = true }
sdc-census10to20 = { workspace = true }
sdc-redistribute = { workspace = true }
sdc-catchment = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "seaborn>=0.13.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
