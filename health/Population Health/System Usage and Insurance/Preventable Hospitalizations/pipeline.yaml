name: preventable_hospitalizations
version: "1.0.0"
description: "Preventable hospitalization rate from County Health Rankings"

sources:
  va:
    type: county_health_rankings
    state: VA
    geographies: [county]
    county_health_rankings:
      sheet_name: "Ranked Measure Data"
      urls:
        2015: "https://www.countyhealthrankings.org/sites/default/files/media/document/state/downloads/2015%20County%20Health%20Rankings%20Virginia%20Data%20-%20v3.xls"
        2016: "https://www.countyhealthrankings.org/sites/default/files/media/document/state/downloads/2016%20County%20Health%20Rankings%20Virginia%20Data%20-%20v3.xls"
        2017: "https://www.countyhealthrankings.org/sites/default/files/media/document/state/downloads/2017%20County%20Health%20Rankings%20Virginia%20Data%20-%20v2.xls"
        2018: "https://www.countyhealthrankings.org/sites/default/files/media/document/state/downloads/2018%20County%20Health%20Rankings%20Virginia%20Data%20-%20v3.xls"
        2019: "https://www.countyhealthrankings.org/sites/default/files/media/document/state/downloads/2019%20County%20Health%20Rankings%20Virginia%20Data%20-%20v1_0.xls"
        2020: "https://www.countyhealthrankings.org/sites/default/files/media/document/2020%20County%20Health%20Rankings%20Virginia%20Data%20-%20v1_0.xlsx"
        2021: "https://www.countyhealthrankings.org/sites/default/files/media/document/2021%20County%20Health%20Rankings%20Virginia%20Data%20-%20v1_0.xlsx"
      measures:
        - name: prevent_hosp_rate
          columns:
            2015: "Preventable Hosp. Rate"
            2016: "Preventable Hosp. Rate"
            2017: "Preventable Hosp. Rate"
            2018: "Preventable Hosp. Rate"
            2019: "Preventable Hosp. Rate"
            2020: "Preventable Hospitalization Rate"
            2021: "Preventable Hospitalization Rate"

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
