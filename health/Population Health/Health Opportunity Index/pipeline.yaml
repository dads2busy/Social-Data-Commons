name: health_opportunity_index
version: "1.0.0"
description: "Virginia Department of Health — Health Opportunity Index indicators"

sources:
  va:
    type: vdh_hoi
    state: VA
    geographies: [tract]
    vdh_hoi:
      # Bedford City tract was dissolved into Bedford County in 2013
      bedford_city_fixup:
        old_geoid: "51515050100"
        new_geoid: "51019050100"

      # Two consolidated Excel files used for 2020 data
      consolidated_files:
        hoi_v3: "HOI V3 14 Variables_For UVA.xlsx"
        hoi_indexes: "hoi_indexes_quintile_2022.xlsx"

      indicators:
        # ---- Pattern A: 2017 only, individual Excel, quintile text labels ----

        - name: affordability_indicator
          years: [2017]
          source_2017:
            file: "afford.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text

        - name: education_indicator
          years: [2017]
          source_2017:
            file: "education.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text

        - name: employment_access_indicator
          years: [2017]
          source_2017:
            file: "emp_access.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text

        - name: income_inequality_indicator
          years: [2017]
          source_2017:
            file: "Gini_ct_map.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text

        - name: job_participation_indicator
          years: [2017]
          source_2017:
            file: "LPI_ct_map.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text

        - name: population_churning_indicator
          years: [2017]
          source_2017:
            file: "pop_churn.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text

        - name: population_density_indicator
          years: [2017]
          source_2017:
            file: "pop_density.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text

        # ---- Pattern B: 2017 + 2020, individual Excel + HOI V3 consolidated ----

        - name: access_care_indicator
          years: [2017, 2020]
          source_2017:
            file: "access_care.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text
          source_2020:
            file: "HOI V3 14 Variables_For UVA.xlsx"
            geoid_col: CT2
            value_col: "**Accees to Care"
            value_type: continuous_quintile
            invert: true

        - name: air_quality_indicator
          years: [2017, 2020]
          source_2017:
            file: "air_qual.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text
          source_2020:
            file: "HOI V3 14 Variables_For UVA.xlsx"
            geoid_col: CT2
            value_col: "Environmental*"
            value_type: continuous_quintile
            invert: true

        - name: food_accessibility_indicator
          years: [2017, 2020]
          source_2017:
            file: "food_access.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text
          source_2020:
            file: "HOI V3 14 Variables_For UVA.xlsx"
            geoid_col: CT2
            value_col: "Food Access*"
            value_type: continuous_quintile
            invert: true

        - name: material_deprivation_indicator
          years: [2017, 2020]
          source_2017:
            file: "mat_depr.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text
          source_2020:
            file: "HOI V3 14 Variables_For UVA.xlsx"
            geoid_col: CT2
            value_col: "Townsend*"
            value_type: continuous_quintile
            invert: true

        - name: segregation_indicator
          years: [2017, 2020]
          source_2017:
            file: "seggreg.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text
          source_2020:
            file: "HOI V3 14 Variables_For UVA.xlsx"
            geoid_col: CT2
            value_col: "**Spatial Segregation"
            value_type: continuous_quintile
            invert: true

        - name: walkability_indicator
          years: [2017, 2020]
          source_2017:
            file: "walk.xlsx"
            geoid_col: Ctfips
            value_col: "Indicator Selector"
            value_type: quintile_text
          source_2020:
            file: "HOI V3 14 Variables_For UVA.xlsx"
            geoid_col: CT2
            value_col: Walkability
            value_type: continuous_quintile
            invert: true

        # ---- Pattern C: 2020 only, hoi_indexes_quintile_2022.xlsx ----

        - name: community_environment_indicator
          years: [2020]
          source_2020:
            file: "hoi_indexes_quintile_2022.xlsx"
            geoid_col: CT
            value_col: "Built Environment Profile SI"
            value_type: continuous_quintile
            invert: false

        - name: consumer_opportunity_indicator
          years: [2020]
          source_2020:
            file: "hoi_indexes_quintile_2022.xlsx"
            geoid_col: CT
            value_col: "Consumer Profile SI"
            value_type: continuous_quintile
            invert: false

        - name: economic_opportunity_indicator
          years: [2020]
          source_2020:
            file: "hoi_indexes_quintile_2022.xlsx"
            geoid_col: CT
            value_col: "Economic Profile SI"
            value_type: continuous_quintile
            invert: false

        - name: health_opportunity_indicator
          years: [2020]
          source_2020:
            file: "hoi_indexes_quintile_2022.xlsx"
            geoid_col: CT
            value_col: "Composite in Quintiles"
            value_type: quintile_text_extended
            invert: false

        - name: wellness_disparity_indicator
          years: [2020]
          source_2020:
            file: "hoi_indexes_quintile_2022.xlsx"
            geoid_col: CT
            value_col: "Social Impact Profile SI"
            value_type: continuous_quintile
            invert: false

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  standardize: false
