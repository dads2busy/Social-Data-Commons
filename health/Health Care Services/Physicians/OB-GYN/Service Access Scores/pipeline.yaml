name: obgyn_access_scores
version: "3.0.0"
zenodo_deposit_id: 19152569
method: fca
title: "OB-GYN Service Accessibility (FCA)"
description: >-
  Floating catchment area analysis measuring OB-GYN service accessibility
  at block group level using female population age 15+ as consumer demand.
  Computes 2SFCA, E2SFCA, and 3SFCA variants with physician counts from
  CMS Doctors and Clinicians data (2017-2025).

sources:
  cms:
    type: cms_physicians
    description: "CMS Doctors and Clinicians - OB-GYN (Obstetrics/Gynecology)"
    data_file: "data/working/vadcmd_cms_2017_2025_obgyn_physicians.csv"
    geocoded_file: "data/working/vadcmd_cms_2017_2025_obgyn_physicians_geo.csv"
    specialties: ["OBSTETRICS/GYNECOLOGY"]

population:
  type: acs
  table: B01001
  description: "Female population age 15+"
  variables:
    female_15_17: "B01001_030"
    female_18_19: "B01001_031"
    female_20: "B01001_032"
    female_21: "B01001_033"
    female_22_24: "B01001_034"
    female_25_29: "B01001_035"
    female_30_34: "B01001_036"
    female_35_39: "B01001_037"
    female_40_44: "B01001_038"
    female_45_49: "B01001_039"
    female_50_54: "B01001_040"
    female_55_59: "B01001_041"
    female_60_61: "B01001_042"
    female_62_64: "B01001_043"
    female_65_66: "B01001_044"
    female_67_69: "B01001_045"
    female_70_74: "B01001_046"
    female_75_79: "B01001_047"
    female_80_84: "B01001_048"
    female_85_plus: "B01001_049"

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  geographies: [block_group, tract, county, health_district]
  years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  coverage_areas: [va, ncr]
