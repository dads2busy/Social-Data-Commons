name: mental_health_access_scores
version: "1.0.0"
title: "Mental Health Service Accessibility (FCA)"
description: >-
  Floating catchment area analysis measuring mental health service
  accessibility at block group level. Computes 2SFCA, E2SFCA, and 3SFCA
  variants with provider counts from SAMHSA mental health facility locator.

sources:
  providers:
    type: geojson
    description: "SAMHSA mental health facility geocoded locations"
    file: "data/distribution/ncr_samhsa_2022_mental_health_points.geojson"
    capacity_col: null

output:
  path: data/distribution
  geographies: [block_group, tract, county, health_district]
  years: [2022]
  coverage_areas: [va, ncr]
