name: urgent_care_access_scores
version: "4.0.1"
method: fca
title: "Urgent Care Center Accessibility (FCA)"
description: >-
  Floating catchment area analysis measuring urgent care center
  accessibility at block group level. Computes 2SFCA, E2SFCA, and 3SFCA
  variants with facility counts from NPPES NPI Registry data
  (taxonomy 261QU0200X). Covers VA and NCR with automated NPPES
  download and Census geocoding.

sources:
  nppes:
    type: nppes
    description: "NPPES NPI Registry - Urgent Care Clinic/Center (taxonomy 261QU0200X)"
    taxonomy_code: "261QU0200X"
    data_file: "data/working/vadcmd_nppes_urgent_care.csv"
    geocoded_file: "data/working/vadcmd_nppes_urgent_care_geo.csv"
    download_url: "https://download.cms.gov/nppes/NPI_Files.html"

  population:
    type: census_acs
    variable: "B01001_001"
    geography: block_group
    states: ["51", "24", "11"]

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  geographies: [block_group, tract, county, health_district]
  years: [2020, 2021, 2022, 2023, 2024, 2025]
  coverage_areas: [va, ncr]
