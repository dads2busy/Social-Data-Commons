name: urgent_care_access_scores
version: "2.0.0"
method: fca
title: "Urgent Care Center Accessibility (FCA)"
description: >-
  Floating catchment area analysis measuring urgent care center
  accessibility at block group level. Computes 2SFCA, E2SFCA, and 3SFCA
  variants with provider counts from Google Maps urgent care locations.
  NCR-only — provider data covers the NCR region only.

sources:
  providers:
    type: geojson
    description: "Google Maps urgent care center geocoded locations"
    file: "data/distribution/ncr_gmap_2022_urgent_care_points.geojson"
    capacity_col: null

population:
  variable: "B01001_001"
  acs_year: 2021
  states: ["51", "24", "11"]

output:
  path: data/distribution
  geographies: [block_group, tract, county]
  years: [2022]
  coverage_areas: [ncr]
