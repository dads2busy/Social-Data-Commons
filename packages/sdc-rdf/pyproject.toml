[project]
name = "sdc-rdf"
version = "0.4.0"
description = "RDF knowledge-graph output (RDF Data Cube + core ontology) for Social Data Commons pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "rdflib>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyshacl>=0.26", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdc_rdf"]

[tool.ruff]
line-length = 100
