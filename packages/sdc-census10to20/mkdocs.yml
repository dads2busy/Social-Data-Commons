site_name: sdc-census10to20
site_description: Redistribute 2010-2019 census data onto 2020 census boundaries
site_url: https://uva-bi-sdad.github.io/sdc-census10to20/
repo_url: https://github.com/uva-bi-sdad/sdc-census10to20
repo_name: uva-bi-sdad/sdc-census10to20
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Articles:
      - Getting Started: articles/getting-started.md
  - Reference:
      - standardize_all: reference/standardize_all.md
      - convert_2010_to_2020_bounds: reference/convert_2010_to_2020_bounds.md
      - create_crosswalk: reference/create_crosswalk.md
      - get_2010_2020_bound_changes: reference/get_2010_2020_bound_changes.md
