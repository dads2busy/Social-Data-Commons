name: Deploy sdc-census10to20 docs

on:
  push:
    branches: [main]
    paths:
      - "packages/sdc-census10to20/docs/**"
      - "packages/sdc-census10to20/mkdocs.yml"
      - "packages/sdc-census10to20/src/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs deps
        run: |
          pip install -e "packages/sdc-census10to20[docs]"
      - name: Build docs
        working-directory: packages/sdc-census10to20
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/sdc-census10to20/site
      - uses: actions/deploy-pages@v4
        id: deployment
