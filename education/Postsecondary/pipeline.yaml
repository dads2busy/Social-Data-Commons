name: postsecondary
version: "2.0.0"
title: "Postsecondary"
description: "Postsecondary education attainment from ACS B06009"

sources:
  ncr:
    type: census_acs
    profile: NCR
    years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      total:            "B06009_001"
      in_college:       "B06009_004"
      college_complete: "B06009_005"
      post_college:     "B06009_006"

  va:
    type: census_acs
    profile: VA
    years: [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    variables:
      total:            "B06009_001"
      in_college:       "B06009_004"
      college_complete: "B06009_005"
      post_college:     "B06009_006"

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  standardize: true
