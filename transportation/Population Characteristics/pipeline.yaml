name: population_characteristics
version: "1.0.1"
description: "Transportation population characteristics (commute time, carpool, no vehicle) from ACS subject tables S0801 and S2504"

sources:
  ncr:
    type: census_acs
    profile: NCR
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    table_type: subject
    variables:
      commute_time: "S0801_C01_046"
      perc_carpool: "S0801_C01_004"
      perc_no_vehicle: "S2504_C02_027"

  va:
    type: census_acs
    profile: VA
    years: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    geographies: [tract, county]
    table_type: subject
    variables:
      commute_time: "S0801_C01_046"
      perc_carpool: "S0801_C01_004"
      perc_no_vehicle: "S2504_C02_027"

crosswalks:
  va_county_to_hd: "geographies/VA/State Geographies/Health Districts/2020/data/distribution/va_ct_to_hd_crosswalk.csv"

output:
  path: data/distribution
  standardize: true
