name: residential_energy_scenario
description: "Integrated 2030 VA residential energy scenario: synthetic household adoption rates, ResStock-derived hourly load, and PV generation profiles, aggregated to county and tract."

source:
  type: simulated
  data_source_token: sim
  coverage_area: va
  scenario: va_2030_solar_324k_0_25ev     # placeholder; revise when '0.25ev' meaning is attributed
  scenario_year: 2030
  household_csv: data/original/va_household.csv
  adoption_csv: data/original/va_adoption.csv
  pv_profiles_csv: data/original/va_pv_profiles.csv
  resstock_csv: data/original/va_resstock.csv

geographies:
  va_counties: "geographies/VA/Census Geographies/County/2020/data/distribution/va_geo_census_cb_2020_counties.geojson"
  # The simulation's tracts are 2010-vintage (all 1,872 are 2010 tracts; 268 do not
  # exist in 2020). ingest.py publishes them as *_geo10 and redistributes them onto
  # 2020 tracts as *_geo20 (sdc-census10to20); the RDF graph puts *_geo10 tract rows
  # on 2010-vintage tract IRIs (sdcid:tract-2010/…).
  geo10_tract_vintage: 2010
  va_tracts_2010: "geographies/VA/Census Geographies/Tract/2010/data/distribution/va_geo_census_cb_2010_census_tracts.geojson"
  va_tracts_2020: "geographies/VA/Census Geographies/Tract/2020/data/distribution/va_geo_census_cb_2020_census_tracts.geojson"

resolutions:
  - county
  - tract

output:
  combined_csv: data/distribution/va_cttr_sim_2030_residential_energy_scenario.csv.xz
  rdf_graph: data/distribution/va_cttr_sim_2030_residential_energy_scenario.nt.xz  # static + hourly cubes, _geo20 and _geo10
