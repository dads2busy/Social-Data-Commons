  data_source_token: sim          # filename token; placeholder until source attribution is finalized
  coverage_area: va
  scenario: va_2030_run30         # placeholder; revisit when '_30' suffix meaning is clarified
  scenario_year: 2030
  input_file: data/original/va_charging_stations_30.csv

geographies:
